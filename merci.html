<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ta commande – Emt Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.png" alt="Logo Emt Academy" class="logo"><span>Emt Academy</span></a>
  <a class="support-link" href="mailto:emtacademy@protonmail.com">Support</a>
</header>
<main class="merci">
  <h1 id="titre">Vérification du paiement…</h1>
  <p id="msg"></p>
  <div id="envoi" hidden>
    <p>Entre ton adresse e-mail : tu y recevras ta formation en PDF.</p>
    <input id="email" type="email" placeholder="ton@email.com" autocomplete="email" inputmode="email">
    <button id="go" class="btn" type="button">Recevoir ma formation</button>
  </div>
  <small id="ref"></small>
  <a href="index.html">← Retour aux formations</a>
</main>
<script src="produits.js"></script>
<script>
const q = new URLSearchParams(location.search);
let order = q.get("order");
try { order = order || localStorage.getItem("emt_order"); } catch (_) {}
const $ = id => document.getElementById(id);
let essais = 0;
async function verifier() {
  if (!order || !API_URL) { $("titre").textContent = "Commande introuvable"; $("msg").textContent = "Écris-nous : emtacademy@protonmail.com"; return; }
  $("ref").textContent = "N° de commande : " + order + " (garde cette page)";
  try {
    const d = await (await fetch(API_URL + "/api/status?order=" + encodeURIComponent(order))).json();
    if (d.status === "success") {
      $("titre").textContent = "Paiement confirmé ✓ Merci !";
      $("msg").textContent = d.nom;
      $("envoi").hidden = false; return;
    }
    if (d.status === "failed") { $("titre").textContent = "Paiement non abouti"; $("msg").textContent = "Tu peux réessayer depuis la page des formations."; return; }
  } catch (_) {}
  if (++essais < 40) setTimeout(verifier, 3000);
  else { $("titre").textContent = "Paiement en attente"; $("msg").textContent = "Si tu as été débité, écris-nous avec ton numéro de commande."; }
}
verifier();
$("go").onclick = async () => {
  const email = $("email").value.trim(), b = $("go");
  if (!email) { $("msg").textContent = "Entre ton e-mail."; return; }
  b.disabled = true; b.textContent = "Envoi…";
  try {
    const d = await (await fetch(API_URL + "/api/envoyer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ order, email }) })).json();
    if (d.ok) { $("titre").textContent = "Formation envoyée ✓"; $("msg").textContent = "Vérifie ta boîte mail (et les courriers indésirables) : " + email; $("envoi").hidden = true; return; }
    $("msg").textContent = d.error || "Erreur, réessaie.";
  } catch (_) { $("msg").textContent = "Erreur de connexion, réessaie."; }
  b.disabled = false; b.textContent = "Recevoir ma formation";
};
</script>
</body>
</html>
